# Banco PostgreSQL local para desenvolvimento (nunca use produção para `migrate dev`).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: g7_erp
    ports:
      - "5433:5432"
    volumes:
      - g7_erp_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d g7_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  g7_erp_db:
